name = "babyshare"
main = "cloudflare/worker.mjs"
compatibility_date = "2025-09-24"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./client/dist"
binding = "ASSETS"
run_worker_first = [
  "/",
  "/api/*",
  "/upload",
  "/download/*",
  "/secure-download/*",
  "/guest-download",
  "/guest-login",
  "/guest-upload",
  "/guest-view",
  "/login",
  "/logout",
  "/register",
  "/dashboard",
  "/files",
  "/admin",
  "/home",
  "/list",
  "/manage-users",
  "/delete/*",
]

[[d1_databases]]
binding = "DB"
database_name = "babyshare"
database_id = "cd823cd8-c2f0-4d20-a2e0-570717896e62"
migrations_dir = "cloudflare/migrations"

[[durable_objects.bindings]]
name = "LAN_HUB"
class_name = "BabyShareLanHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BabyShareLanHub"]

[vars]
BOOTSTRAP_ADMIN_USERNAME = "admin"

[triggers]
crons = ["17 * * * *"]
