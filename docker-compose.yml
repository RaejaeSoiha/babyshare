services:
  babyshare:
    build: .
    container_name: babyshare
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BBS_DATA_DIR: /data
      HTTP_PORT: 3000
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Preserve the existing local runtime data without copying it into the image.
      - ./uploads:/data/uploads
      - ./users.json:/data/users.json
      - ./shares.json:/data/shares.json
      - ./sessions:/data/sessions
